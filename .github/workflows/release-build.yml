name: Windows Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked build dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Verify source
        shell: pwsh
        run: .\verify.ps1

      - name: Generate Windows version metadata
        run: python tools/generate_version_info.py

      - name: Build executable
        shell: pwsh
        run: >-
          python -m PyInstaller --onefile --windowed
          --name Softcurse_Media_Downloader
          --icon assets\yt.ico
          --add-data "assets;assets"
          --add-data "VERSION;."
          --version-file build\version_info.txt
          --hidden-import yt_dlp --hidden-import mutagen --hidden-import PIL
          --hidden-import pygame --hidden-import pystray --hidden-import plyer
          --clean --noconfirm main.py

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\Softcurse_Media_Downloader.exe).Hash.ToLower()
          Set-Content -Encoding ascii dist\Softcurse_Media_Downloader.exe.sha256 "$hash *Softcurse_Media_Downloader.exe"

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Softcurse-Media-Downloader-${{ github.ref_name }}-unsigned
          path: |
            dist/Softcurse_Media_Downloader.exe
            dist/Softcurse_Media_Downloader.exe.sha256
          if-no-files-found: error

