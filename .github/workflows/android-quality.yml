name: Android quality

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-quality.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-quality.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Test and assemble debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: softcurse-android-debug
          path: android/app/build/outputs/apk/debug/Softcurse-Systems-Media-Downloader-debug.apk
          if-no-files-found: error
